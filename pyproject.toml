[project]
name = "housecheck"
version = "0.1.0"
description = "Compare student rental addresses with sourced, cross-checked public data. Open Agent Hackathon 2026, Track 1."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
housecheck = "housecheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["housecheck*"]

[tool.setuptools.package-data]
housecheck = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
